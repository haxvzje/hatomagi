<!doctype html>
<html lang="en">

        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Bio Page - Hatomagi">

        <link rel="shortcut icon" href="assets/favico/icon.png" type="image/png">
        <link rel="stylesheet" href="assets/fonts/gothampro/style.css">
        <link rel="stylesheet" href="assets/vars.css">
        <link rel="stylesheet" href="assets/css/index/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

        <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
        <script src="assets/js/text.js"></script>
        <script src="assets/js/typed.min.js"></script>
    </head>
    <body class="center">
        <script src="assets/js/parallax.js" type="text/javascript"></script>

        <div class="bg-layer" aria-hidden="true"></div>

        <div class="ui-root">

        <div id="donate">
            <div class="popup">
                <h1>Donate</h1>
                <p align="center">
                    <h3><span class="font-size=larger">Donate me if you want.</span></h3>
                    <p align="center">
                        <input type="button" class="btn" value="PlayerDuo" onclick="location.href='https://playerduo.com/baziki'">
                    </p>
                    <p align="center">
                        <input class="btn" type="button" value="Close" title="Close" onclick="document.getElementById('donate').style.display='none';">
                    </p>
                </p>
            </div>
        </div>

        <div id="mini-player" class="mini-player is-hidden"></div>
        <button type="button" class="music-toggle top-control" aria-label="Show music player"><i class="fa-solid fa-music"></i> Music</button>

        <header class="center info">
            <div class="center pizdec">
                <div class="avatar-container">
                    <img src="assets/images/avatar.png" oncontextmenu="return false;" class="avatar" alt="Avatar">
                    <img src="assets/images/decoration/angry.png" class="decoration" alt="Decoration">
                </div>
                <h2><span id="name">haxvzje</span></h2>
                <hr width="295">
                <h3><span class="decode-text" data-text="what's cookin', haxvzje?">what's cookin', haxvzje?</span></h3>
                <hr width="295">
                <h2>Social Links</h2>
            </div>

            <div class="buttons">
                <a href="https://www.linkedin.com/in/duy-thai-3b447538b/" class="link">LinkedIn</a>
                <a href="https://soundcloud.com/haxvzje" class="link">SoundCloud</a>
            </div>
            <div class="buttons">
                <a href="https://github.com/haxvzje" class="link">Github</a>
            </div>
            <div class="buttons">
                <a href="https://buymeacoffee.com/baziki" class="link">☕ Buy Me a Coffee</a>
            </div>

            <p>
                <h9>
                    <span id="name"><script>document.write(new Date().getFullYear())</script> © | Made with <span class="heart" aria-label="love">&#10084;</span> by <b>haxvzje</b></span>
                </h9>
            </p>
        </header>

        <!-- <button type="button" class="theme-toggle top-control theme-toggle--disabled" aria-disabled="true">Theme: Catppuccin</button> -->

        </div>

        <script src="assets/js/snow.js" type="text/javascript"></script>
        <script src="assets/js/player.js" type="text/javascript"></script>
        <script src="assets/js/oneko.js" type="text/javascript"></script>
        <script src="assets/js/decoded.js" type="text/javascript"></script>
        <script>
            (function () {
                const KEY = 'theme';
                const stored = localStorage.getItem(KEY) || 'catppuccin';
                if (stored === 'catppuccin') document.documentElement.setAttribute('data-theme', 'catppuccin');

                const updateZoomVars = () => {
                    const dpr = window.devicePixelRatio || 1;
                    document.documentElement.style.setProperty('--zoom', dpr.toString());
                    document.documentElement.style.setProperty('--bg-scale', (1 / dpr).toString());
                };
                updateZoomVars();
                window.addEventListener('resize', updateZoomVars);
                let lastDpr = window.devicePixelRatio || 1;
                setInterval(() => {
                    const current = window.devicePixelRatio || 1;
                    if (current !== lastDpr) {
                        lastDpr = current;
                        updateZoomVars();
                    }
                }, 500);
            })();
        </script>
    </body>
</html>
